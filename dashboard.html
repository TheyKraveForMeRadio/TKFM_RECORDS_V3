<!DOCTYPE html>
<html>
<head>
<title>TKFM Dashboard</title>

<link rel="stylesheet" href="css/tkfm-global.css">
<link rel="stylesheet" href="css/mobile.css">

</head>

<body>

<h1>💰 TKFM Dashboard</h1>

<div>
  <h2>Balance</h2>
  <p id="balance">$0</p>
</div>

<div>
  <h2>Portfolio</h2>
  <div id="portfolio"></div>
</div>

<script>

const API = "https://tkfm-records-v3.onrender.com/engine";
const TOKEN = localStorage.getItem("token");

async function load(){

  if(!TOKEN){
    window.location = "/login.html";
    return;
  }

  const res = await fetch(API + "/user-stats-engine?user=user1", {
    headers: {
      "Authorization": "Bearer " + TOKEN
    }
  });

  const data = await res.json();

  document.getElementById("balance").innerText = "$" + (data.balance || 0);

  let html = "";

  if(data.assets){
    for (let asset in data.assets){
      html += `<p>${asset}: ${data.assets[asset]}</p>`;
    }
  }

  document.getElementById("portfolio").innerHTML = html;

}

load();

</script>

</body>
</html>

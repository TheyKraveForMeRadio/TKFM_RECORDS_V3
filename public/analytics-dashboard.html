<!DOCTYPE html>
<html>

<head>
<link rel="stylesheet" href="css/tkfm-global.css?v=3">
<link rel="stylesheet" href="css/tkfm-global.css?v=2">
<link rel="stylesheet" href="css/tkfm-global.css">
<title>TKFM Analytics</title>
<script src="/js/tkfm-master-autoload.js"></script>
</head>


<h1>Platform Analytics</h1>

<pre id="analytics"></pre>

<script>

async function load(){

 const res = await fetch(
 '/.netlify/functions/api/analytics-data'
 );

 const data = await res.json();

 document.getElementById("analytics")
 .textContent =
 JSON.stringify(data,null,2);

}

load();

</script>

</body>
</html>

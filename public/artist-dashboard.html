<!DOCTYPE html>
<html>

<head>
<link rel="stylesheet" href="css/tkfm-global.css?v=3">

<link rel="stylesheet" href="css/tkfm-global.css">
<title>Artist Dashboard</title>
<script src="/js/tkfm-master-autoload.js"></script>
</head>


<h1>Artist Dashboard</h1>

<pre id="catalogs"></pre>

<script>

async function load(){

 const res =
 await fetch('/.netlify/functions/api/catalog-ai-valuation');

 const data = await res.json();

 document.getElementById("catalogs")
 .textContent =
 JSON.stringify(data,null,2);

}

load();

</script>

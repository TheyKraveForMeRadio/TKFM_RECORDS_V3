<!DOCTYPE html>
<html>
<head>
  <title>TKFM ADMIN</title>
  <link rel="stylesheet" href="css/tkfm-global.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>

<h1>💸 Withdrawals Admin</h1>

<div id="list"></div>

<script>
const API = "https://tkfm-records-v3.onrender.com/engine"

async function load(){
  const res = await fetch(API + "/admin-withdrawals-engine")
  const data = await res.json()

  let html = ""

  data.withdrawals.forEach(w=>{
    html += `
      <div class="card">
        <p>User: ${w.user}</p>
        <p>Amount: $${w.amount}</p>
        <p>Status: ${w.status}</p>
        <button onclick="approve('${w.user}', ${w.index})">
          Approve + Pay
        </button>
      </div>
    `
  })

  document.getElementById("list").innerHTML = html
}

async function approve(user, index){
  await fetch(API + `/admin-withdrawals-engine?action=approve&user=${user}&index=${index}`)
  load()
}

load()
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

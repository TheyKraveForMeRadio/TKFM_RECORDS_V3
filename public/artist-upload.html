<!DOCTYPE html>
<html>
<head>
  <title>Artist Upload</title>
  <link rel="stylesheet" href="css/tkfm-global.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>

<header style="display:flex;align-items:center;gap:15px;padding:20px;">
  <img src="tkfm-records-logo.png" class="logo" height="60">
  <h1>UPLOAD YOUR SONG</h1>
</header>

<div class="card" style="margin:20px;">
  <input id="artist" placeholder="Artist Name"><br><br>
  <input id="title" placeholder="Track Title"><br><br>
  <input id="price" placeholder="Starting Price"><br><br>

  <button onclick="upload()">Upload & List ($10)</button>
</div>

<script>
const API = "https://tkfm-records-v3.onrender.com/engine"

async function upload(){

  // 💳 charge artist $10 listing fee
  const pay = await fetch(API + "/stripe-deposit-engine", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ amount:10, user:"artist" })
  })

  const session = await pay.json()

  if(session.url){
    window.location = session.url
  } else {
    alert("Payment failed")
  }
}
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

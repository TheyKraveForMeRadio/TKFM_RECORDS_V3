<!DOCTYPE html>
<html>
<head>
  <title>Rewards</title>
  <link rel="stylesheet" href="css/tkfm-global.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>

<h1>🎁 Rewards Center</h1>

<div class="card">
  <button onclick="daily()">Claim Daily Reward</button>
</div>

<div class="card">
  <h3>Mission: Make 3 Trades</h3>
  <div id="mission"></div>
  <button onclick="claim()">Claim Mission Reward</button>
</div>

<script>
const API = "https://tkfm-records-v3.onrender.com/engine"
const user = "user1"

async function daily(){
  const res = await fetch(API + "/daily-reward-engine", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ user })
  })
  const data = await res.json()
  alert(JSON.stringify(data))
}

async function loadMission(){
  const res = await fetch(API + "/mission-engine?user=" + user)
  const data = await res.json()

  document.getElementById("mission").innerText =
    data.progress + " / 3 trades"
}

async function claim(){
  const res = await fetch(API + "/claim-mission-engine", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ user })
  })
  const data = await res.json()
  alert(JSON.stringify(data))
}

setInterval(loadMission, 3000)
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

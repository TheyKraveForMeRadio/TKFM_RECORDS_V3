<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/tkfm-global.css?v=3">
<link rel="stylesheet" href="css/tkfm-global.css?v=2">
<link rel="stylesheet" href="css/tkfm-global.css">
  <title>Executive Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
  </style>
<script src="/js/tkfm-master-autoload.js"></script>
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<header style="display:flex;align-items:center;gap:15px;padding:20px;">
<img src="public/tkfm-records-logo.png" class="logo" height="60">
<h1>TKFM EXCHANGE</h1>
</header>

<h1>Executive Revenue Chart</h1>

<canvas id="revChart"></canvas>

<script>

async function loadChart() {

  const res = await fetch('/.netlify/functions/api/revenue-growth-loop');
  const data = await res.json();

  const labels = data.map(d=>d.month);
  const values = data.map(d=>parseFloat(d.growthRate));

  new Chart(document.getElementById('revChart'), {
    type:'line',
    data:{
      labels,
      datasets:[{
        label:'Growth %',
        data:values
      }]
    }
  });
}

loadChart();

</script>
</body>
</html>

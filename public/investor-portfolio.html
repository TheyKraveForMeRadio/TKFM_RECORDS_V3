<!DOCTYPE html>
<html>

<head>
<link rel="stylesheet" href="css/tkfm-global.css?v=3">
<link rel="stylesheet" href="css/tkfm-global.css?v=2">
<link rel="stylesheet" href="css/tkfm-global.css">
<title>Investor Portfolio</title>
<script src="/js/tkfm-master-autoload.js"></script>
<link rel="stylesheet" href="css/mobile.css">
</head>


<h1>Your Royalty Portfolio</h1>

<pre id="portfolio"></pre>

<script>

async function loadPortfolio(){

 const res = await fetch(
 '/.netlify/functions/api/portfolio'
 );

 const data = await res.json();

 document.getElementById("portfolio")
 .textContent =
 JSON.stringify(data,null,2);

}

loadPortfolio();

</script>

</body>
</html>

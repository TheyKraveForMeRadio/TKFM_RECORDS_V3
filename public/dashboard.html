<!DOCTYPE html>
<html>
<head>
  <title>TKFM Dashboard</title>
  <style>
    body {
      background: #020617;
      color: white;
      font-family: Arial;
      padding: 40px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    h1 {
      color: #22d3ee;
    }

    button {
      padding: 10px 20px;
      margin: 5px;
      background: #a855f7;
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 8px;
    }

    input {
      padding: 10px;
      width: 300px;
      margin-bottom: 20px;
    }
  </style>
</head>

<body>

<h1>🎧 TKFM DASHBOARD</h1>

<div class="card">
  <input id="emailInput" placeholder="Enter your email" />
  <button onclick="loadUser()">Load Dashboard</button>
</div>

<div class="card">
  <h2>User Info</h2>
  <p>Email: <span id="email">-</span></p>
  <p>Name: <span id="name">-</span></p>
  <p>Plan: <span id="plan">-</span></p>
  <p>Subscription: <span id="subscription">-</span></p>
</div>

<div class="card">
  <h2>Credits</h2>
  <p>Credits: <span id="credits">0</span></p>
</div>

<div class="card">
  <h2>Actions</h2>
  <button onclick="buyCredits()">Buy Credits</button>
  <button onclick="upgradePlan()">Upgrade Plan</button>
  <button onclick="submitTrack()">Submit Track</button>
</div>

<script src="/js/dashboard.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>

  <title>TKFM Dashboard</title>

<body>

<h1>🎧 My Submissions</h1>
<div id="list"></div>

<script>
const API = "https://jgopbtuteqzooomxaulx.supabase.co/rest/v1/submissions";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impnb3BidHV0ZXF6b29vbXhhdWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4ODA1MzUsImV4cCI6MjA4MDQ1NjUzNX0.0ZiEaOd7ZXOgK1YXk-KcnyLFjTi4WngbX30j2gp5E0k";

const email = localStorage.getItem("tkfm_user");

async function load() {
  const res = await fetch(API + `?email=eq.${email}`, {
    headers: {
      "apikey": KEY,
      "Authorization": `Bearer ${KEY}`
    }
  });

  const data = await res.json();

  document.getElementById("list").innerHTML =
    data.map(d => `
      <div style="margin:20px;padding:10px;border:1px solid #444">
        <h3>${d.track_title}</h3>
        <p>Status: ${d.status}</p>
        <p>Plan: ${d.plan}</p>
      </div>
    `).join('');
}

load();
</script>

</body>
</html>

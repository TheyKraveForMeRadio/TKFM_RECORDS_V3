<!DOCTYPE html>
<html>
<head>
  <title>TKFM Dashboard</title>
</head>
<body>

<h1>💰 My Stats</h1>
<div id="stats"></div>

<script>
const API = "https://jgopbtuteqzooomxaulx.supabase.co/rest/v1/referral_stats";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impnb3BidHV0ZXF6b29vbXhhdWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4ODA1MzUsImV4cCI6MjA4MDQ1NjUzNX0.0ZiEaOd7ZXOgK1YXk-KcnyLFjTi4WngbX30j2gp5E0k";

const user = localStorage.getItem("tkfm_user");

async function load() {
  const res = await fetch(API + `?user_email=eq.${user}`, {
    headers: {
      "apikey": KEY,
      "Authorization": `Bearer ${KEY}`
    }
  });

  const data = await res.json();

  const d = data[0] || { invites: 0, rewards: 0 };

  const refLink = window.location.origin + "?ref=" + btoa(user);

  document.getElementById("stats").innerHTML = `
    <p>Invites: ${d.invites}</p>
    <p>Rewards: ${d.rewards}</p>
    <p>Your Link:</p>
    <input value="${refLink}" style="width:100%" onclick="this.select()" />
  `;
}

load();
</script>

</body>
</html>

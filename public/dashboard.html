<!DOCTYPE html>
<html>
<head>
  <title>TKFM Dashboard</title>
  <link rel="stylesheet" href="css/tkfm-global.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>

<header style="display:flex;align-items:center;gap:15px;padding:20px;">
  <img src="tkfm-records-logo.png" class="logo" height="60">
  <h1>MY DASHBOARD</h1>
</header>

<div class="card" style="margin:20px;">
  <h2>💰 Wallet Balance</h2>
  <h1 id="balance">$0</h1>
</div>

<div class="card" style="margin:20px;">
  <h2>📊 Portfolio</h2>
  <div id="portfolio"></div>
</div>

<script>
const API = "https://tkfm-records-v3.onrender.com/engine"
const TOKEN = localStorage.getItem("token")

async function load(){
  const res = await authFetch( + "/user-stats-engine?user=user1", {
    headers: { Authorization: "Bearer " + TOKEN }
  })

  const data = await res.json()

  document.getElementById("balance").innerText = "$" + data.balance

  let html = ""

  for (let asset in data.assets){
    html += `<p>${asset}: ${data.assets[asset]}</p>`
  }

  document.getElementById("portfolio").innerHTML = html
}

load()
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

<!DOCTYPE html>
<html>


<h1>Royalty Payout Dashboard</h1>

<pre id="payouts"></pre>

<script>

async function load(){

 const res =
 await fetch('/.netlify/functions/api/royalty-payouts');

 const data = await res.json();

 document.getElementById("payouts")
 .textContent =
 JSON.stringify(data,null,2);

}

load();

</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

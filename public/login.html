<!DOCTYPE html>
<html>

<head>
<link rel="stylesheet" href="css/tkfm-global.css?v=3">
<link rel="stylesheet" href="css/tkfm-global.css?v=2">
<link rel="stylesheet" href="css/tkfm-global.css">
<title>Login</title>
<script src="/js/tkfm-master-autoload.js"></script>
<link rel="stylesheet" href="css/mobile.css">
</head>


<h1>Login</h1>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="login()">Login</button>

<script>

async function login(){

 const email =
 document.getElementById("email").value;

 const password =
 document.getElementById("password").value;

 const res = await fetch(
 '/.netlify/functions/api/login-user',
 {
  method:"POST",
  body:JSON.stringify({
   email,
   password
  })
 }
 );

 const data = await res.json();

 localStorage.setItem("token",data.token);

 alert("Logged in");

}

</script>

</body>
</html>

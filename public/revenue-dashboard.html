<!DOCTYPE html>
<html>
<head>
  <title>Revenue Dashboard</title>
  <link rel="stylesheet" href="css/tkfm-global.css">
<link rel="stylesheet" href="css/mobile.css">
<link rel="manifest" href="/manifest.json">
</head>
<body>

<h1>💰 Streaming Revenue</h1>

<div id="rev"></div>

<script>
const API = "https://tkfm-records-v3.onrender.com/engine"

async function load(){
  const res = await fetch(API + "/assets-engine")
  const data = await res.json()

  let html = ""

  for (let a of data.assets){
    html += `<div class="card">
      <h3>${a.artist} - ${a.title}</h3>
      <p>Revenue Pool: loading...</p>
    </div>`
  }

  document.getElementById("rev").innerHTML = html
}

load()
</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

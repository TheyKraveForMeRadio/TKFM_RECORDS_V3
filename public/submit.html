<!DOCTYPE html>
<html>
<head>
  <title>TKFM Submit</title>
</head>
<body>

<form id="artistForm">
  <input id="artistName" placeholder="Artist Name" required />
  <input id="email" placeholder="Email" required />
  <input id="trackTitle" placeholder="Track Title" required />

  <select id="plan">
    <option value="standard">Standard ($15)</option>
    <option value="priority">🔥 Priority ($50)</option>
    <option value="subscription">Unlimited Monthly ($29)</option>
  </select>

  <button type="submit">Submit</button>
</form>

<script type="module" src="/js/submit-hook.js"></script>

</body>
</html>

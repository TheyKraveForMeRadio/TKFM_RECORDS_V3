<!DOCTYPE html>
<html>


<h1>TKFM Music Marketplace</h1>

<pre id="catalogs"></pre>

<script>

async function load(){

 const res =
 await fetch('/.netlify/functions/api/catalog-index-builder');

 const data = await res.json();

 document.getElementById("catalogs")
 .textContent =
 JSON.stringify(data,null,2);

}

load();

</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

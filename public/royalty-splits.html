<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/tkfm-global.css?v=3">
<link rel="stylesheet" href="css/tkfm-global.css?v=2">
<link rel="stylesheet" href="css/tkfm-global.css">
<title>Royalty Split Setup</title>
<script src="/js/tkfm-master-autoload.js"></script>
</head>


<h1>Royalty Split Setup</h1>

<input id="catalog" placeholder="Catalog ID"><br><br>
<input id="artist" placeholder="Artist Wallet"><br><br>
<input id="percent" placeholder="Percentage"><br><br>

<button onclick="save()">Save Split</button>

<script>

async function save(){

 const catalog =
 document.getElementById("catalog").value;

 const artist =
 document.getElementById("artist").value;

 const percent =
 document.getElementById("percent").value;

 await fetch(
 '/.netlify/functions/api/royalty-split-engine',
 {
  method:"POST",
  body:JSON.stringify({
   catalog,
   artist,
   percent
  })
 }
 );

 alert("Split saved");

}

</script>

</body>
</html>

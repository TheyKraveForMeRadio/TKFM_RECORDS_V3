<!DOCTYPE html>
<html>

<head>
<link rel="stylesheet" href="css/tkfm-global.css?v=3">
<link rel="stylesheet" href="css/tkfm-global.css?v=2">
<link rel="stylesheet" href="css/tkfm-global.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/tkfm-master-autoload.js"></script>
<link rel="stylesheet" href="css/mobile.css">
<link rel="manifest" href="/manifest.json">
</head>


<h1>Catalog Revenue</h1>

<input id="track" placeholder="Track Name">

<button onclick="load()">Load Chart</button>

<canvas id="chart"></canvas>

<script>

async function load(){

 const track =
 document.getElementById("track").value;

 const res =
 await fetch(
 '/.netlify/functions/api/revenue-timeseries?track='+track
 );

 const data =
 await res.json();

 const labels =
 data.map(x => x.created_at);

 const values =
 data.map(x => x.revenue);

 new Chart(
 document.getElementById("chart"),
 {
  type:"line",
  data:{
   labels:labels,
   datasets:[{
    label:"Revenue",
    data:values
   }]
  }
 });

}

</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/tkfm-global.css?v=3">
<link rel="stylesheet" href="css/tkfm-global.css?v=2">
<link rel="stylesheet" href="css/tkfm-global.css">

<title>Catalog Listings</title>

<style>
body{
color:white;
font-family:system-ui;
padding:30px;
}

.catalog{
border:1px solid #22d3ee;
padding:20px;
margin-bottom:15px;
}

</style>

<script src="/js/tkfm-master-autoload.js"></script>
<link rel="stylesheet" href="css/mobile.css">
</head>

<body>
<header style="display:flex;align-items:center;gap:15px;padding:20px;">
<img src="public/tkfm-records-logo.png" class="logo" height="60">
<h1>TKFM EXCHANGE</h1>
</header>

<h1>Music Catalog Marketplace</h1>

<div id="catalogs"></div>

<script>

async function loadCatalogs(){

 const res = await fetch(
  '/.netlify/functions/api/catalog-list'
 );

 const data = await res.json();

 const container = document.getElementById("catalogs");

 container.innerHTML = "";

 data.catalogs.forEach(c => {

  const div = document.createElement("div");

  div.className = "catalog";

  div.innerHTML = `

   <h3>${c.title}</h3>
   <p>Artist: ${c.artist}</p>
   <p>Monthly Revenue: $${c.monthly_revenue}</p>
   <a href="/catalog-detail.html?id=${c.id}">
   <button>View</button>
   </a>

  `;

  container.appendChild(div);

 });

}

loadCatalogs();

</script>

</body>
</html>

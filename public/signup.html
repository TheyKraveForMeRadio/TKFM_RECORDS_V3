<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/tkfm-global.css?v=3">
<link rel="stylesheet" href="css/tkfm-global.css?v=2">
<link rel="stylesheet" href="css/tkfm-global.css">
<title>Signup</title>
<script src="/js/tkfm-master-autoload.js"></script>
<link rel="stylesheet" href="css/mobile.css">
</head>


<h1>Create Account</h1>

<input id="email" placeholder="Email"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="signup()">Create Account</button>

<script>

async function signup(){

 const email =
 document.getElementById("email").value;

 const password =
 document.getElementById("password").value;

 const res = await fetch(
 '/.netlify/functions/api/create-user',
 {
  method:"POST",
  body:JSON.stringify({
   email,
   password
  })
 }
 );

 alert("Account created");

}

</script>

</body>
</html>

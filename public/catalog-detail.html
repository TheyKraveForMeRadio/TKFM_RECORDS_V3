<!DOCTYPE html>
<html>

<head>
<link rel="stylesheet" href="css/tkfm-global.css?v=3">
<link rel="stylesheet" href="css/tkfm-global.css?v=2">
<link rel="stylesheet" href="css/tkfm-global.css">

<title>Catalog Detail</title>

<script src="/js/tkfm-master-autoload.js"></script>
<link rel="stylesheet" href="css/mobile.css">
</head>


<h1>Catalog Detail</h1>

<div id="catalog"></div>

<button onclick="buy()">Buy Royalty Shares</button>

<script>

const params = new URLSearchParams(
 window.location.search
);

const id = params.get("id");

async function loadCatalog(){

 const res = await fetch(
  '/.netlify/functions/api/catalog-detail?id='+id
 );

 const data = await res.json();

 document.getElementById("catalog").innerHTML =
 JSON.stringify(data,null,2);

}

async function buy(){

 await fetch(
 '/.netlify/functions/api/execute-trade',
 {
  method:"POST",
  body:JSON.stringify({catalog_id:id})
 }
 );

 alert("Trade executed");

}

loadCatalog();

</script>

</body>
</html>

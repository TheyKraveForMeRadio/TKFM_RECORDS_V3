<script>
const SUPABASE_URL = "https://jgopbtuteqzooomxaulx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impnb3BidHV0ZXF6b29vbXhhdWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4ODA1MzUsImV4cCI6MjA4MDQ1NjUzNX0.0ZiEaOd7ZXOgK1YXk-KcnyLFjTi4WngbX30j2gp5E0k";

async function loadBalance() {
  const user = localStorage.getItem("tkfm_user") || "djkrave_main_user";

  // FORCE CREATE USER
  await fetch(`${SUPABASE_URL}/rest/v1/rpc/ensure_user`, {
    method: "POST",
    headers: {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ u: user })
  });

  // GET BALANCE
  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/balances?user_id=eq.${user}`,
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    }
  );

  const data = await res.json();

  document.getElementById("balance").innerText =
    "$" + (data[0]?.balance || 0);
}

loadBalance();
</script>

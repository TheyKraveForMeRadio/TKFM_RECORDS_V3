<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>How TKFM Works</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

:root{
--bg:#020617;
--panel:#0f172a;
--gold:#facc15;
--blue:#22d3ee;
--text:#e5e7eb;
}

body{
background:var(--bg);
color:var(--text);
font-family:system-ui;
margin:0;
padding:40px;
}

h1{
text-align:center;
color:var(--gold);
}

.grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-top:40px;
}

.card{
background:var(--panel);
padding:20px;
border-radius:8px;
text-align:center;
}

.step{
font-size:32px;
color:var(--blue);
margin-bottom:10px;
}

button{
margin-top:30px;
background:var(--gold);
border:none;
padding:15px 30px;
border-radius:6px;
font-size:16px;
cursor:pointer;
}

.center{
text-align:center;
}

</style>

</head>

<body>

<h1>How TKFM Works</h1>

<div class="grid">

<div class="card">
<div class="step">1</div>
<h3>Upload Music</h3>
<p>Artists upload songs to TKFM.</p>
</div>

<div class="card">
<div class="step">2</div>
<h3>Song Becomes Asset</h3>
<p>TKFM converts the song into a tradable asset.</p>
</div>

<div class="card">
<div class="step">3</div>
<h3>Fans Invest</h3>
<p>Fans can buy shares of songs they believe in.</p>
</div>

<div class="card">
<div class="step">4</div>
<h3>Streaming Generates Returns</h3>
<p>Streaming revenue flows back to investors.</p>
</div>

</div>

<div class="center">

<button onclick="window.location.href='/tkfm-investor-market-terminal.html'">
Enter The Music Market
</button>

</div>

<script src="/js/tkfm-master-autoload.js"></script>

</body>
</html>

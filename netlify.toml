############################################
# TKFM GLOBAL BUILD CONFIG
############################################

[build]
publish = "."
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22"
NODE_ENV = "production"

############################################
# FUNCTIONS CONFIG
############################################

[functions]
node_bundler = "esbuild"

external_node_modules = [
"ioredis"
]

included_files = [
"netlify/engines/**",
"netlify/functions/_shared/**",
"netlify/functions/_middleware-secret-guard.js"
]

############################################
# FUNCTION TIMEOUT
############################################

[functions.timeout]
seconds = 26

############################################
# TKFM CENTRAL SCHEDULER
############################################

[[scheduled]]
path = "/.netlify/functions/tkfm-master-cron"
schedule = "*/1 * * * *"

############################################
# ECONOMY ENGINES
############################################

[[scheduled]]
path = "/.netlify/functions/api/music-central-bank-engine"
schedule = "*/5 * * * *"

[[scheduled]]
path = "/.netlify/functions/api/music-index-engine"
schedule = "*/2 * * * *"

[[scheduled]]
path = "/.netlify/functions/api/order-flow-engine"
schedule = "*/3 * * * *"

############################################
# EXCHANGE CORE
############################################

[[scheduled]]
path = "/.netlify/functions/api/matching-engine"
schedule = "* * * * *"

[[scheduled]]
path = "/.netlify/functions/api/trade-settlement-engine"
schedule = "* * * * *"

[[scheduled]]
path = "/.netlify/functions/api/price-oracle-engine"
schedule = "*/2 * * * *"

############################################
# TRADE PROCESSOR
############################################

[[scheduled]]
path = "/.netlify/functions/api/trade-processor-engine"
schedule = "* * * * *"

############################################
# AUTONOMOUS MARKET ENGINE
############################################

[[scheduled]]
path = "/.netlify/functions/api/autonomous-market-engine"
schedule = "*/1 * * * *"

############################################
# LIQUIDITY AI
############################################

[[scheduled]]
path = "/.netlify/functions/api/liquidity-ai-engine"
schedule = "*/2 * * * *"

############################################
# GLOBAL METRICS CACHE
############################################

[[scheduled]]
path = "/.netlify/functions/api/tkfm-metrics-cache"
schedule = "*/1 * * * *"

############################################
# MARKET SNAPSHOT ENGINE
############################################

[[scheduled]]
path = "/.netlify/functions/api/tkfm-market-snapshot"
schedule = "*/1 * * * *"

############################################
# SUPERNODE NETWORK
############################################

[[scheduled]]
path = "/.netlify/functions/api/tkfm-supernode"
schedule = "*/2 * * * *"

############################################
# STRIPE WEBHOOK ROUTING
############################################

[[redirects]]
from = "/stripe-webhook"
to = "/.netlify/functions/stripe-webhook-ledger"
status = 200

############################################
# GLOBAL SECURITY HEADERS
############################################

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"


############################################
# TKFM GLOBAL BUILD CONFIG
############################################

[build]
publish = "."
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22"
NODE_ENV = "production"

############################################
# FUNCTIONS CONFIG
############################################

[functions]
node_bundler = "esbuild"

included_files = [
"netlify/engines/**",
"netlify/functions/_shared/**",
"netlify/functions/_middleware-secret-guard.js"
]

############################################
# FUNCTION TIMEOUT
############################################

[functions.timeout]
seconds = 26

############################################
# TKFM CENTRAL SCHEDULER
############################################

[[scheduled]]
path = "/.netlify/functions/tkfm-master-cron"
schedule = "*/1 * * * *"

############################################
# STRIPE WEBHOOK ROUTING
############################################

[[redirects]]
from = "/stripe-webhook"
to = "/.netlify/functions/stripe-webhook-ledger"
status = 200

############################################
# GLOBAL SECURITY HEADERS
############################################

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"


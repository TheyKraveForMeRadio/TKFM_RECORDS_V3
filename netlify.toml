############################################
# TKFM GLOBAL BUILD CONFIG
############################################

[build]
publish = "."
functions = "netlify/functions"

[build.environment]
NODE_VERSION = "22"
NODE_ENV = "production"

############################################
# FUNCTIONS CONFIG
############################################

[functions]
node_bundler = "none"

external_node_modules = [
"stripe",
"jsonwebtoken",
"bcryptjs",
"@supabase/supabase-js",
"ethers",
"ioredis",
"cloudinary",
"pdfkit",
"pdf-lib",
"resend",
"@aws-sdk/client-s3",
"@apollo/server"
]

# IMPORTANT: include the entire engine mesh
included_files = [
"netlify/engines/**",
"netlify/functions/**"
]

############################################
# FUNCTION TIMEOUT
############################################

[functions.timeout]
seconds = 26

############################################
# TKFM CRON
############################################

[[scheduled]]
path = "/.netlify/functions/tkfm-master-cron"
schedule = "*/1 * * * *"

############################################
# STRIPE WEBHOOK
############################################

[[redirects]]
from = "/stripe-webhook"
to = "/.netlify/functions/stripe-webhook-ledger"
status = 200

############################################
# SECURITY HEADERS
############################################

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"

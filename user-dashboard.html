<!DOCTYPE html>
<html>
<head>
<title>TKFM DASHBOARD</title>

<style>
body{
  background:#020617;
  color:#facc15;
  font-family:Arial;
  padding:20px;
}

.card{
  border:1px solid #facc15;
  padding:20px;
  margin-bottom:20px;
}
</style>
</head>

<body>

<h1>🔥 TKFM USER DASHBOARD</h1>

<input id="user" placeholder="Enter username"/>
<button onclick="load()">Load</button>

<div class="card">
<h3>Balance</h3>
<div id="balance"></div>
</div>

<div class="card">
<h3>Portfolio</h3>
<div id="portfolio"></div>
</div>

<div class="card">
<h3>Trades</h3>
<div id="trades"></div>
</div>

<!-- 🔥 NEW: DEPOSIT / WITHDRAW -->
<div class="card">

<h3>Deposit</h3>
<input id="amount" placeholder="Amount"/>
<button onclick="deposit()">Deposit</button>

<h3>Withdraw</h3>
<input id="withdrawAmount" placeholder="Amount"/>
<button onclick="withdraw()">Withdraw</button>

</div>

<script>

const API = "https://www.tkfmrecords.com/.netlify/functions";

async function load(){

  const user = document.getElementById("user").value;

  const data = await fetch(API + "/get-user-dashboard?user=" + user)
    .then(r=>r.json());

  document.getElementById("balance").innerText =
    "$" + data.user.balance;

  document.getElementById("portfolio").innerHTML =
    data.portfolio.map(p=>`Asset ${p.catalog_id}: ${p.shares}`).join("<br>");

  document.getElementById("trades").innerHTML =
    data.trades.map(t=>`${t.price} (${t.shares})`).join("<br>");
}

async function deposit(){
  const user = document.getElementById("user").value;
  const amount = document.getElementById("amount").value;

  const res = await fetch(API + "/stripe-deposit", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ user, amount })
  }).then(r=>r.json());

  window.location = res.url;
}

async function withdraw(){
  const user = document.getElementById("user").value;
  const amount = document.getElementById("withdrawAmount").value;

  const res = await fetch(API + "/withdraw", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ user, amount })
  }).then(r=>r.json());

  alert(JSON.stringify(res));
}

</script>

</body>
</html>

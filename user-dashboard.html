<!DOCTYPE html>
<html>
<head>
<title>TKFM DASHBOARD</title>

<style>
body{
  background:#020617;
  color:#facc15;
  font-family:Arial;
  padding:20px;
}

.card{
  border:1px solid #facc15;
  padding:20px;
  margin-bottom:20px;
}
</style>
<script src="/js/tkfm-theme.js"></script>
<script src="/js/tkfm-animations.js"></script>
</head>

<body>

<h1>🔥 TKFM USER DASHBOARD</h1>

<input id="user" placeholder="Enter username"/>
<button onclick="load()">Load</button>

<div class="card">
<h3>Balance</h3>
<div id="balance"></div>
</div>

<div class="card">
<h3>Portfolio</h3>
<div id="portfolio"></div>
</div>

<div class="card">
<h3>Trades</h3>
<div id="trades"></div>
</div>

<div class="card">

<h3>Deposit</h3>
<input id="amount" placeholder="Amount"/>
<button onclick="deposit()">Deposit</button>

<h3>Withdraw</h3>
<input id="withdrawAmount" placeholder="Amount"/>
<button onclick="withdraw()">Withdraw</button>

</div>

<!-- 🔥 NFT SIMULATION -->
<div class="card">
<h3>My NFTs (Simulated)</h3>
<button onclick="fakeMint()">Mint NFT</button>
<button onclick="loadMyNFTs()">Load NFTs</button>
<div id="nfts"></div>
</div>

<script src="/js/tkfm-fake-web3.js"></script>

<script>

const API = "https://www.tkfmrecords.com/.netlify/functions";

async function load(){

  const user = document.getElementById("user").value;

  const data = await fetch(API + "/get-user-dashboard?user=" + user)
    .then(r=>r.json());

  document.getElementById("balance").innerText =
    "$" + data.user.balance;

  document.getElementById("portfolio").innerHTML =
    data.portfolio.map(p=>`Asset ${p.catalog_id}: ${p.shares}`).join("<br>");

  document.getElementById("trades").innerHTML =
    data.trades.map(t=>`${t.price} (${t.shares})`).join("<br>");
}

async function deposit(){
  const user = document.getElementById("user").value;
  const amount = document.getElementById("amount").value;

  const res = await fetch(API + "/stripe-deposit", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ user, amount })
  }).then(r=>r.json());

  window.location = res.url;
}

async function withdraw(){
  const user = document.getElementById("user").value;
  const amount = document.getElementById("withdrawAmount").value;

  const res = await fetch(API + "/withdraw", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ user, amount })
  }).then(r=>r.json());

  alert(JSON.stringify(res));
}

</script>

</body>
</html>

<div class="card">
  <h3>🎮 Game Progress</h3>
  <div id="xp"></div>
  <div id="streak"></div>

  <button onclick="claimDaily()">Claim Daily Reward</button>
</div>

<script>

async function loadGame(){

  const user = document.getElementById("user").value;

  const data = await fetch(API + "/get-user-dashboard?user=" + user)
    .then(r=>r.json());

  document.getElementById("xp").innerText =
    "XP: " + (data.user.xp || 0);

  document.getElementById("streak").innerText =
    "Streak: " + (data.user.streak || 0);

}

async function claimDaily(){

  const user = document.getElementById("user").value;

  const res = await fetch(API + "/daily-reward-engine",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ user })
  });

  const data = await res.json();

  alert(JSON.stringify(data));
  loadGame();
}

</script>

<div class="card">
  <h3>💸 Withdraw Funds</h3>

  <input id="withdrawAmount" placeholder="Amount"/>
  <button onclick="withdrawFunds()">Withdraw</button>
</div>

<script>

async function withdrawFunds(){

  const user = document.getElementById("user").value;
  const amount = document.getElementById("withdrawAmount").value;

  const res = await fetch(API + "/request-withdrawal",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ user, amount: Number(amount) })
  });

  const data = await res.json();

  alert(JSON.stringify(data));
}

</script>

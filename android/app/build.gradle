plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tkfm.records'
    compileSdk 34

    defaultConfig {
        applicationId "com.tkfm.records"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.0"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TKFM Leaderboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#020617;
  color:#fff;
  text-align:center;
}
h1{
  color:#facc15;
  margin-top:40px;
}
.table{
  max-width:600px;
  margin:40px auto;
  text-align:left;
}
.row{
  display:flex;
  justify-content:space-between;
  padding:12px;
  border-bottom:1px solid #333;
}
.top{
  color:#facc15;
  font-weight:bold;
}
.reward{
  font-size:12px;
  color:#22c55e;
}
</style>
</head>

<body>

<h1>🏆 Top Referrers</h1>

<div id="board" class="table"></div>

<script>
const supabase = window.supabase.createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_SUPABASE_KEY"
);

function getReward(count){
  if(count >= 50) return "💎 VIP Access + 1000 Credits";
  if(count >= 25) return "🚀 Early Access + 500 Credits";
  if(count >= 10) return "🔥 Beta Access + 100 Credits";
  if(count >= 5) return "🎧 Priority Access";
  return "";
}

async function loadLeaderboard(){

  const { data } = await supabase
    .from("waitlist")
    .select("ref_by")
    .not("ref_by", "is", null);

  const counts = {};

  data.forEach(r=>{
    counts[r.ref_by] = (counts[r.ref_by] || 0) + 1;
  });

  const sorted = Object.entries(counts)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,20);

  const board = document.getElementById("board");

  sorted.forEach((item, i)=>{
    const row = document.createElement("div");
    row.className = "row";

    if(i < 3) row.classList.add("top");

    const reward = getReward(item[1]);

    row.innerHTML = `
      <div>
        <div>#${i+1} — ${item[0]}</div>
        <div class="reward">${reward}</div>
      </div>
      <span>${item[1]} invites</span>
    `;

    board.appendChild(row);
  });
}

loadLeaderboard();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>TKFM — The Music Market</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="/js/tkfm-theme.js"></script>
<script src="/js/tkfm-animations.js"></script>

<style>
body{
margin:0;
font-family:system-ui;
background:radial-gradient(circle,#020617,#000);
color:#e5e7eb;
text-align:center;
}

.hero{
padding:120px 20px;
}

input{
padding:15px;
width:250px;
border-radius:6px;
border:1px solid #facc15;
background:#020617;
color:#fff;
}

button{
padding:15px 25px;
background:#facc15;
border:none;
margin-left:10px;
cursor:pointer;
}
</style>

</head>

<body>

<div class="hero">

<h1 style="color:#facc15">💰 Trade Music Like Stocks</h1>

<p>Join the first users of TKFM</p>

<br>

<input id="email" placeholder="Enter your email"/>
<button onclick="join()">Join Waitlist</button>

<p id="msg"></p>

<br><br>

<button onclick="go()">🚀 Enter Platform</button>

</div>

<script>

const API = "https://www.tkfmrecords.com/.netlify/functions";

async function join(){

  const email = document.getElementById("email").value;

  const res = await fetch(API + "/waitlist",{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email })
  });

  const data = await res.json();

  document.getElementById("msg").innerText =
    data.success ? "You're on the list 🚀" : "Error";

}

function go(){
  window.location = "/pro-trading-ui.html";
}

</script>

</body>
</html>

<script>
// 🔥 SAVE REF CODE
const params = new URLSearchParams(window.location.search);
const ref = params.get("ref");

if(ref){
  localStorage.setItem("tkfm_ref", ref);
}
</script>

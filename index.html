<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TKFM Waitlist</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      background:#020617;
      color:white;
      font-family:sans-serif;
      text-align:center;
      padding:40px;
    }

    h1{
      color:#facc15;
    }

    input{
      padding:15px;
      width:80%;
      max-width:300px;
      margin:20px 0;
      border-radius:8px;
      border:1px solid #facc15;
    }

    /* ✅ FIXED BUTTON TEXT */
    button{
      padding:15px 25px;
      background:#facc15;
      border:none;
      margin:10px 0;
      cursor:pointer;
      border-radius:8px;
      font-weight:bold;
      color:#000;
    }

    #refBox{
      display:none;
      margin-top:20px;
      padding:15px;
      border:1px solid #facc15;
      border-radius:10px;
    }
  </style>
</head>
<body>

<h1>💰 Trade Music Like Stocks</h1>
<p>Join the first users of TKFM</p>

<input id="email" placeholder="Enter your email" />

<br>
<button onclick="join()">Join Waitlist</button>

<p id="msg"></p>

<div id="refBox">
  <p>🔥 Your Invite Link:</p>
  <p id="refLink"></p>
  <button onclick="copyRef()">Copy Link</button>
</div>

<br>
<button onclick="window.location='/pro-trading-ui.html'">🚀 Enter Platform</button>
<button onclick="window.location='/leaderboard.html'">🏆 View Leaderboard</button>
<button onclick="window.location='/dashboard.html'">📊 My Dashboard</button>
<button onclick="window.location='/login.html'">🔐 Login</button>

<script>
const API = "/.netlify/functions";

async function join(){
  const email = document.getElementById("email").value;

  const res = await fetch(API + "/waitlist", {
    method:"POST",
    body: JSON.stringify({ email }),
  });

  const data = await res.json();

  if(data.success){
    document.getElementById("msg").innerText = "You're on the list 🚀";

    const ref = btoa(email);
    const link = window.location.origin + "?ref=" + ref;

    document.getElementById("refBox").style.display = "block";
    document.getElementById("refLink").innerText = link;

    window.copyRef = () => {
      navigator.clipboard.writeText(link);
      alert("Copied 🚀");
    };
  } else {
    document.getElementById("msg").innerText = "Error submitting";
  }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/auth.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TKFM — The Music Market</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:system-ui;
background:radial-gradient(circle,#020617,#000);
color:#e5e7eb;
text-align:center;
}
.hero{
padding:120px 20px;
}
input{
padding:15px;
width:250px;
border-radius:6px;
border:1px solid #facc15;
background:#020617;
color:#fff;
}
button{
padding:15px 25px;
background:#facc15;
border:none;
margin:10px;
cursor:pointer;
font-weight:bold;
border-radius:8px;
}
.refbox{
margin-top:20px;
padding:15px;
background:#020617;
border:1px solid #facc15;
display:none;
}
</style>
</head>

<body>
<div class="hero">
<h1 style="color:#facc15">💰 Trade Music Like Stocks</h1>
<p>Join the first users of TKFM</p>

<br>

<input id="email" placeholder="Enter your email"/>

<br><br>

<button onclick="join()">Join Waitlist</button>

<p id="msg"></p>

<div id="refbox" class="refbox">
<p>🔥 Your Invite Link:</p>
<p id="reflink"></p>
<button onclick="copyRef()">Copy Link</button>
</div>

<br>

<button onclick="go()">🚀 Enter Platform</button>

<br>

<button onclick="window.location='/leaderboard.html'">
🏆 View Leaderboard
</button>

</div>

<script>
const API = "/.netlify/functions";

async function join(){
  try{
    const email = document.getElementById("email").value;
    const ref = localStorage.getItem("tkfm_ref");

    const res = await fetch(API + "/waitlist",{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ email, ref })
    });

    const data = await res.json();

    if(data.success){
      document.getElementById("msg").innerText = "You're on the list 🚀";

      const link = window.location.origin + "?ref=" + data.ref_code;

      document.getElementById("reflink").innerText = link;
      document.getElementById("refbox").style.display = "block";

      localStorage.setItem("tkfm_my_ref", data.ref_code);

      setTimeout(() => {
        window.location.href = "/pro-trading-ui.html";
      }, 2000);

    } else {
      document.getElementById("msg").innerText = "Error submitting";
    }

  } catch(e){
    document.getElementById("msg").innerText = "Network error";
  }
}

function copyRef(){
  const text = document.getElementById("reflink").innerText;
  navigator.clipboard.writeText(text);
  alert("Copied 🚀");
}

function go(){
  window.location.href = "/pro-trading-ui.html";
}

const params = new URLSearchParams(window.location.search);
const ref = params.get("ref");
if(ref){
  localStorage.setItem("tkfm_ref", ref);
}
</script>

</body>
</html>

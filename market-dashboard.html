<!DOCTYPE html>
<html>
<head>
  <title>TKFM PRO MARKET</title>
  <style>
    body { background:#020617; color:#fff; font-family:Arial; padding:20px }
    canvas { background:#111827 }
    select { padding:8px; margin-bottom:10px }
  </style>
</head>
<body>

<h1>🚀 TKFM MULTI-ASSET MARKET</h1>

<select id="asset">
  <option value="song123">song123</option>
  <option value="song456">song456</option>
</select>

<canvas id="chart" width="800" height="300"></canvas>

<script>
const API = "https://tkfm-records-v3.onrender.com/engine"

let candles = []

const ctx = document.getElementById("chart").getContext("2d")

function drawCandles(){

  ctx.clearRect(0,0,800,300)

  if(!candles.length) return

  const max = Math.max(...candles.map(c=>c.high))
  const min = Math.min(...candles.map(c=>c.low))

  candles.forEach((c,i)=>{

    const x = i * 10 + 20

    const openY = 300 - ((c.open-min)/(max-min||1))*300
    const closeY = 300 - ((c.close-min)/(max-min||1))*300
    const highY = 300 - ((c.high-min)/(max-min||1))*300
    const lowY = 300 - ((c.low-min)/(max-min||1))*300

    ctx.strokeStyle = c.close >= c.open ? "#22c55e" : "#ef4444"

    // wick
    ctx.beginPath()
    ctx.moveTo(x, highY)
    ctx.lineTo(x, lowY)
    ctx.stroke()

    // body
    ctx.fillStyle = ctx.strokeStyle
    ctx.fillRect(x-3, Math.min(openY,closeY), 6, Math.abs(openY-closeY))

  })

}

async function loadCandles(){

  const asset = document.getElementById("asset").value

  const res = await fetch(`${API}/candlestick-engine?catalog_id=${asset}`)
  const data = await res.json()

  candles = data.candles.slice(-50)

  drawCandles()
}

setInterval(loadCandles, 2000)
</script>

</body>
</html>

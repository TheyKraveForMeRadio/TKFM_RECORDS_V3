<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TKFM Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:system-ui;
  background:#020617;
  color:#fff;
  text-align:center;
  padding-top:120px;
}
input{
  padding:15px;
  width:250px;
  border-radius:6px;
  border:1px solid #facc15;
  background:#020617;
  color:#fff;
}
button{
  padding:15px 25px;
  background:#facc15;
  border:none;
  margin-top:15px;
  cursor:pointer;
  font-weight:bold;
  border-radius:8px;
}
</style>
</head>

<body>

<h1 style="color:#facc15">🔐 Login to TKFM</h1>

<input id="email" placeholder="Enter your email" />
<br>
<button onclick="login()">Send Magic Link</button>

<p id="msg"></p>

<script>
const supabase = window.supabase.createClient(
  "YOUR_SUPABASE_URL",
  "YOUR_SUPABASE_KEY"
);

async function login(){
  const email = document.getElementById("email").value;

  const { error } = await supabase.auth.signInWithOtp({
    email: email
  });

  document.getElementById("msg").innerText =
    error ? "Error sending link" : "Check your email 🚀";
}
</script>

</body>
</html>

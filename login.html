<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login to TKFM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  background:#020617;
  font-family:sans-serif;
  color:white;
  text-align:center;
  padding:40px;
}
h1{
  color:#facc15;
}
input{
  padding:15px;
  width:80%;
  max-width:300px;
  margin:15px 0;
  border-radius:8px;
  border:1px solid #facc15;
}
button{
  padding:15px 25px;
  background:#facc15;
  border:none;
  margin:10px 0;
  cursor:pointer;
  border-radius:8px;
  font-weight:bold;
}
</style>
</head>

<body>

<h1>🔐 Login to TKFM</h1>

<input id="email" placeholder="Enter your email">
<br>
<button onclick="sendCode()">Send Code</button>

<br><br>

<input id="code" placeholder="Enter 6-digit code">
<br>
<button onclick="verify()">Verify & Login</button>

<p id="msg"></p>

<script>
const API = "/.netlify/functions";

async function sendCode(){
  const email = document.getElementById("email").value;
  const msg = document.getElementById("msg");

  if(!email){
    msg.innerText = "Enter email";
    return;
  }

  msg.innerText = "Sending code...";

  try{
    const res = await fetch(API + "/send-code", {
      method:"POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email })
    });

    const data = await res.json();
    msg.innerText = data.success ? "Code sent 📩" : "Error sending";

  }catch(e){
    msg.innerText = "Network error";
  }
}

async function verify(){
  const email = document.getElementById("email").value;
  const code = document.getElementById("code").value;
  const msg = document.getElementById("msg");

  msg.innerText = "Verifying...";

  try{
    const res = await fetch(API + "/verify-code", {
      method:"POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, code })
    });

    const data = await res.json();

    if(data.success){
      localStorage.setItem("tkfm_user", JSON.stringify(data.user));
      window.location = "/dashboard.html";
    } else {
      msg.innerText = "Invalid code";
    }

  }catch(e){
    msg.innerText = "Network error";
  }
}
</script>

</body>
</html>

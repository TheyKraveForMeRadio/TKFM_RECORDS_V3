<!DOCTYPE html>
<html>
<head>
  <title>TKFM TRADING APP</title>
  <style>
    body { background:#020617; color:#fff; font-family:Arial; padding:20px }
    input, button { padding:10px; margin:5px }
  </style>
</head>
<body>

<h1>🔐 TKFM SECURE TRADING</h1>

<div id="auth">
  <input id="username" placeholder="username">
  <input id="password" placeholder="password" type="password">
  <button onclick="login()">Login</button>
</div>

<div id="trade" style="display:none">
  <h2>Trade</h2>
  <input id="price" placeholder="price">
  <input id="qty" placeholder="quantity">
  <button onclick="buy()">BUY</button>
  <button onclick="sell()">SELL</button>
</div>

<script>
const API = "https://tkfm-records-v3.onrender.com/engine"
let TOKEN = localStorage.getItem("token")

if (TOKEN) {
  document.getElementById("auth").style.display = "none"
  document.getElementById("trade").style.display = "block"
}

async function login(){

  const username = document.getElementById("username").value
  const password = document.getElementById("password").value

  const res = await fetch(API + "/auth-engine", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ action:"login", username, password })
  })

  const data = await res.json()

  if (data.token) {
    TOKEN = data.token
    localStorage.setItem("token", TOKEN)

    document.getElementById("auth").style.display = "none"
    document.getElementById("trade").style.display = "block"
  } else {
    alert("Login failed")
  }

}

async function trade(side){

  const price = parseFloat(document.getElementById("price").value)
  const quantity = parseFloat(document.getElementById("qty").value)

  const res = await fetch(API + "/trade-queue-engine", {
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "Authorization":"Bearer " + TOKEN
    },
    body: JSON.stringify({
      catalog_id:"song123",
      price,
      quantity,
      side
    })
  })

  const data = await res.json()
  console.log(data)

}

function buy(){ trade("buy") }
function sell(){ trade("sell") }

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>TKFM MARKET</title>
</head>

<body>

<h1>TKFM LIVE MARKET</h1>

<input id="catalog" placeholder="Catalog ID">
<input id="price" placeholder="Price">
<input id="shares" placeholder="Shares">

<button onclick="buy()">Place Buy</button>
<button onclick="sell()">Place Sell</button>

<pre id="orderbook"></pre>

<script>

async function place(side){

  await fetch("/.netlify/functions/engine/place-order-engine", {
    method:"POST",
    body:JSON.stringify({
      user:"demo",
      catalog_id:document.getElementById("catalog").value,
      side,
      price:Number(document.getElementById("price").value),
      shares:Number(document.getElementById("shares").value)
    })
  });

}

function buy(){ place("buy"); }
function sell(){ place("sell"); }

async function loadBook(){

  const res = await fetch("/.netlify/functions/engine/orderbook-engine?catalog_id="+document.getElementById("catalog").value);

  const data = await res.json();

  document.getElementById("orderbook").innerText =
  JSON.stringify(data,null,2);
}

setInterval(loadBook,2000);

</script>

</body>
</html>

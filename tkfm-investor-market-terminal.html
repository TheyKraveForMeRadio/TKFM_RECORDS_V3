<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8" />
<title>TKFM Investor Market Terminal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
--bg:#020617;
--panel:#0f172a;
--gold:#facc15;
--blue:#22d3ee;
--green:#22c55e;
--red:#ef4444;
--text:#e5e7eb;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui;
}

header{
background:#000;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
height:40px;
}

.marketcap{
color:var(--gold);
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
padding:20px;
max-width:1400px;
margin:auto;
}

.panel{
background:var(--panel);
border-radius:8px;
padding:20px;
}

.section{
font-weight:bold;
color:var(--gold);
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #1e293b;
font-size:14px;
}

.trade{
font-size:13px;
padding:5px 0;
border-bottom:1px solid #1e293b;
}

.green{color:var(--green)}
.red{color:var(--red)}

footer{
text-align:center;
padding:30px;
font-size:.8rem;
color:#64748b;
}

</style>

<script src="/js/tkfm-theme.js"></script>
<script src="/js/tkfm-animations.js"></script>
</head>

<body>

<header>

<img src="/tkfm-records-logo.png" class="logo" />

<div class="marketcap">
Global Music Market Cap: <span id="marketcap">$0</span>
</div>

</header>

<div class="grid">

<div class="panel">

<div class="section">Music Index Chart</div>

<canvas id="indexChart" height="200"></canvas>

</div>

<div class="panel">

<div class="section">Live Trades</div>

<div id="trades"></div>

</div>

<div class="panel">

<div class="section">Top Songs</div>

<div id="songs"></div>

</div>

<div class="panel">

<div class="section">Streaming Revenue Signals</div>

<div id="streams"></div>

</div>

</div>

<footer>
TKFM Music Exchange · DJ KRAVE
</footer>

<script>

/* MARKET STREAM */

const stream =
new EventSource("/.netlify/functions/api/tkfm-market-stream-engine")

stream.onmessage = function(e){

const data = JSON.parse(e.data)

if(data.market_cap){

document.getElementById("marketcap")
.innerText="$"+Number(data.market_cap).toLocaleString()

}

if(data.recent_trades){

const container =
document.getElementById("trades")

container.innerHTML=""

data.recent_trades.slice(0,10).forEach(t=>{

const row=document.createElement("div")
row.className="trade"

row.innerText =
t.catalog_id+" "+t.quantity+" @ $"+t.price

container.appendChild(row)

})

}

}

/* LOAD SONG MARKET */

async function loadSongs(){

const res =
await fetch("/.netlify/functions/api/catalog-market-data")

const data =
await res.json()

const container =
document.getElementById("songs")

container.innerHTML=""

(data.market||[]).slice(0,10).forEach(s=>{

const row=document.createElement("div")
row.className="row"

const change =
Math.random()>.5
? "<span class='green'>▲</span>"
: "<span class='red'>▼</span>"

row.innerHTML =
s.catalog_id+" "+change+" $"+s.price

container.appendChild(row)

})

}

loadSongs()
setInterval(loadSongs,5000)

/* STREAMING ORACLE */

async function loadStreams(){

const res =
await fetch("/.netlify/functions/api/streaming-revenue-oracle")

const data =
await res.json()

const container =
document.getElementById("streams")

container.innerHTML=""

(data.assets||[]).slice(0,10).forEach(a=>{

const row=document.createElement("div")
row.className="row"

row.innerText =
a.catalog_id+
" Streams: "+Math.round(a.streams)+
" Revenue: $"+a.revenue.toFixed(2)

container.appendChild(row)

})

}

loadStreams()
setInterval(loadStreams,10000)

/* MUSIC INDEX CHART */

async function loadIndex(){

const res =
await fetch("/.netlify/functions/api/music-index-engine")

const data =
await res.json()

const ctx =
document.getElementById("indexChart")

const values = []

for(let i=0;i<20;i++){

values.push(data.index_value*(0.95+Math.random()*0.1))

}

new Chart(ctx,{
type:"line",
data:{
labels:values.map((v,i)=>i),
datasets:[{
label:"TKFM Music Index",
data:values,
borderColor:"#22d3ee"
}]
}
})

}

loadIndex()

</script>

<script src="/js/tkfm-master-autoload.js"></script>

<script src="/js/tkfm-global-nav.js"></script>
</body>
</html>

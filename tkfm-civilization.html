<!DOCTYPE html>
<html>

<head>
<title>TKFM Autonomous Music Civilization</title>
<script src="/js/tkfm-master-autoload.js"></script>
<script src="/js/tkfm-theme.js"></script>
<script src="/js/tkfm-animations.js"></script>
</head>

<body>

<h1>TKFM Autonomous Music Civilization</h1>

<pre id="data"></pre>

<script>

async function load(){

 const res = await fetch(
  "/.netlify/functions/api/ai-civilization-core"
 )

 const data = await res.json()

 document.getElementById("data").innerText =
  JSON.stringify(data,null,2)

}

load()

</script>

<script src="/js/tkfm-global-nav.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<title>TKFM LIVE EXCHANGE</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  background:#020617;
  color:#facc15;
  font-family:Arial;
}

header{
  padding:20px;
  font-size:24px;
  color:#f97316;
  border-bottom:1px solid #222;
}

.container{
  display:grid;
  grid-template-columns: 3fr 1fr;
  gap:20px;
  padding:20px;
}

.card{
  border:1px solid #facc15;
  border-radius:12px;
  padding:15px;
  box-shadow:0 0 20px rgba(250,204,21,0.15);
}

.stats{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.stat{
  text-align:center;
}

.orderbook{
  display:flex;
  justify-content:space-between;
}

.column{
  width:48%;
}

.trade{
  animation:fadeIn 0.5s ease;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

.price-up{ color:#22c55e; }
.price-down{ color:#ef4444; }

</style>
</head>

<body>

<header>🔥 TKFM LIVE EXCHANGE</header>

<div class="container">

<!-- LEFT -->
<div class="card">

<div class="stats">
  <div class="stat">
    <div>Price</div>
    <div id="price">$0</div>
  </div>
  <div class="stat">
    <div>Trades</div>
    <div id="tradeCount">0</div>
  </div>
  <div class="stat">
    <div>Status</div>
    <div id="status">LIVE</div>
  </div>
</div>

<canvas id="chart"></canvas>

</div>

<!-- RIGHT -->
<div class="card">

<h3>Order Book</h3>

<div class="orderbook">
  <div class="column">
    <h4>BUY</h4>
    <div id="buys"></div>
  </div>

  <div class="column">
    <h4>SELL</h4>
    <div id="sells"></div>
  </div>
</div>

<h3>Trades</h3>
<div id="trades"></div>

</div>

</div>

<script>

const API = "https://www.tkfmrecords.com/.netlify/functions";

let chart;

function initChart(){
  const ctx = document.getElementById('chart');

  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: [],
      datasets: [{
        data: [],
        borderWidth:2,
        tension:0.3
      }]
    },
    options:{
      plugins:{ legend:{ display:false } }
    }
  });
}

async function loadMarket(){

  try{

    // TRADES
    const trades = await fetch(API + "/get-trades").then(r=>r.json());

    document.getElementById("tradeCount").innerText = trades.length;

    document.getElementById("trades").innerHTML =
      trades.map(t => `<div class="trade">${t.price} (${t.shares})</div>`).join("");

    if(trades.length){
      const prices = trades.map(t => t.price);
      chart.data.labels = prices.map(()=> "");
      chart.data.datasets[0].data = prices;
      chart.update();

      const last = trades[0];
      document.getElementById("price").innerText = "$" + last.price;
    }

    // ORDERBOOK
    const ob = await fetch(API + "/get-orderbook-engine").then(r=>r.json());

    document.getElementById("buys").innerHTML =
      (ob.buys || []).map(o => `<div class="trade price-up">${o.price} (${o.shares})</div>`).join("");

    document.getElementById("sells").innerHTML =
      (ob.sells || []).map(o => `<div class="trade price-down">${o.price} (${o.shares})</div>`).join("");

  }catch(e){
    console.log("ERROR:", e);
    document.getElementById("status").innerText = "ERROR";
  }

}

// run matching engine every cycle (keeps market active)
async function runEngine(){
  try{
    await fetch(API + "/matching-engine");
  }catch(e){}
}

initChart();

setInterval(() => {
  runEngine();
  loadMarket();
}, 2000);

</script>

</body>
</html>

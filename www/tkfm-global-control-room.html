<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<title>TKFM Global Control Room</title>

<style>

body{
background:#020617;
color:#e5e7eb;
font-family:system-ui;
margin:0;
}

header{
background:#000;
padding:20px;
font-size:20px;
font-weight:bold;
color:#facc15;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:20px;
padding:20px;
}

.panel{
background:#0f172a;
padding:20px;
border-radius:6px;
}

.stat{
font-size:28px;
color:#22d3ee;
}

.engine{
padding:5px 0;
border-bottom:1px solid #1e293b;
font-size:12px;
}

</style>

<script src="/js/tkfm-theme.js"></script>
<script src="/js/tkfm-animations.js"></script>
</head>

<body>

<header>
TKFM GLOBAL CONTROL ROOM
</header>

<div class="grid">

<div class="panel">

<div>Engines Running</div>

<div class="stat" id="engineCount">0</div>

</div>

<div class="panel">

<div>Trade Volume</div>

<div class="stat" id="tradeVolume">0</div>

</div>

<div class="panel">

<div>Market Cap</div>

<div class="stat" id="marketCap">$0</div>

</div>

</div>

<div class="panel">

<div>Engine Status</div>

<div id="engineList"></div>

</div>

<script>

async function loadSystem(){

const res =
await fetch("/.netlify/functions/api/tkfm-system-monitor")

const data =
await res.json()

document.getElementById("engineCount")
.innerText = data.engine_count

const list =
document.getElementById("engineList")

list.innerHTML=""

data.engines.slice(0,50).forEach(e=>{

const row=document.createElement("div")

row.className="engine"

row.innerText=e.engine+" ✓"

list.appendChild(row)

})

}

loadSystem()

setInterval(loadSystem,5000)

</script>

<script src="/js/tkfm-global-nav.js"></script>
</body>
</html>

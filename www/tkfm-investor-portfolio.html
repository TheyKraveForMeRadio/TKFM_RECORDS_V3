<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Investor Portfolio — TKFM</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

:root{
--bg:#020617;
--panel:#0f172a;
--gold:#facc15;
--blue:#22d3ee;
--green:#22c55e;
--text:#e5e7eb;
}

body{
margin:0;
background:var(--bg);
color:var(--text);
font-family:system-ui;
}

header{
background:#000;
padding:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
height:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
padding:20px;
max-width:1200px;
margin:auto;
}

.panel{
background:var(--panel);
padding:20px;
border-radius:8px;
}

.stat{
font-size:28px;
color:var(--blue);
}

.section{
color:var(--gold);
margin-bottom:10px;
}

.row{
display:flex;
justify-content:space-between;
padding:8px 0;
border-bottom:1px solid #1e293b;
}

</style>

<script src="/js/tkfm-theme.js"></script>
<script src="/js/tkfm-animations.js"></script>
</head>

<body>

<header>

<img src="/tkfm-records-logo.png" class="logo">

<div>
Investor Portfolio
</div>

</header>

<div class="grid">

<div class="panel">
<div class="section">Portfolio Value</div>
<div class="stat" id="portfolioValue">$0</div>
</div>

<div class="panel">
<div class="section">Streaming Yield</div>
<div class="stat" id="yield">0%</div>
</div>

<div class="panel">
<div class="section">Music Index</div>
<div class="stat" id="index">0</div>
</div>

</div>

<div class="panel" style="margin:20px">

<div class="section">Portfolio Holdings</div>

<div id="holdings">

<div class="row">
<span>Song123</span>
<span>100 shares</span>
</div>

<div class="row">
<span>Song456</span>
<span>50 shares</span>
</div>

<div class="row">
<span>Song789</span>
<span>200 shares</span>
</div>

</div>

</div>

<div class="panel" style="margin:20px">

<div class="section">Portfolio Performance</div>

<canvas id="portfolioChart" height="120"></canvas>

</div>

<script>

/* MOCK DATA FOR NOW */

document.getElementById("portfolioValue").innerText="$12,400"
document.getElementById("yield").innerText="14.2%"
document.getElementById("index").innerText="812"

const ctx=document.getElementById("portfolioChart")

new Chart(ctx,{
type:"line",
data:{
labels:["Jan","Feb","Mar","Apr","May"],
datasets:[{
label:"Portfolio Value",
data:[4000,5200,7600,9800,12400],
borderColor:"#22d3ee"
}]
}
})

</script>

<script src="/js/tkfm-master-autoload.js"></script>

<script src="/js/tkfm-global-nav.js"></script>
</body>
</html>

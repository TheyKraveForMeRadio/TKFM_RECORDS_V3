<!DOCTYPE html>
<html>

<head>
<title>TKFM Creator Fund</title>
<script src="/js/tkfm-master-autoload.js"></script>
<script src="/js/tkfm-theme.js"></script>
<script src="/js/tkfm-animations.js"></script>
</head>

<body>

<h1>TKFM Creator Fund</h1>

<button onclick="load()">Load Fund NAV</button>

<pre id="nav"></pre>

<script>

async function load(){

const res = await fetch(
"/.netlify/functions/api/fund-nav-engine"
)

const data = await res.json()

document.getElementById("nav").innerText =
JSON.stringify(data,null,2)

}

</script>

<script src="/js/tkfm-global-nav.js"></script>
</body>

</html>

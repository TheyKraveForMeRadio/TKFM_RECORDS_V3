<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>TKFM LIVE MARKET</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body { background:#020617; color:#facc15; text-align:center; font-family:sans-serif; }
h1 { color:#22d3ee; }

.card {
  border:2px solid #facc15;
  margin:20px;
  padding:20px;
  border-radius:20px;
}

button {
  background:#facc15;
  padding:10px 15px;
  border:none;
  border-radius:10px;
  margin:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<h1>🚀 TKFM LIVE MARKET</h1>

<div id="market"></div>

<div class="card">
<h2>Your Balance</h2>
<p id="balance">$0</p>

<button onclick="deposit('tkfm_deposit_10')">Deposit $10</button>
<button onclick="deposit('tkfm_deposit_25')">Deposit $25</button>
<button onclick="deposit('tkfm_deposit_50')">Deposit $50</button>
</div>

<div class="card">
<h2>📦 Your Portfolio</h2>
<div id="portfolio"></div>
</div>

<script>

// USER
localStorage.setItem("tkfm_user", "djkrave_main_user");
const userId = localStorage.getItem("tkfm_user");

// 🔥 YOUR REAL KEYS
const SUPABASE_URL = "https://https://jgopbtuteqzooomxaulx.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impnb3BidHV0ZXF6b29vbXhhdWx4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ4ODA1MzUsImV4cCI6MjA4MDQ1NjUzNX0.0ZiEaOd7ZXOgK1YXk-KcnyLFjTi4WngbX30j2gp5E0k";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ENSURE USER
async function ensureUser(){
  await client.rpc('ensure_user', { u: userId });
}

// BALANCE
async function loadBalance(){
  const { data } = await client
    .from("balances")
    .select("*")
    .eq("user_id", userId);

  document.getElementById("balance").innerText =
    "$" + (data?.length ? data[0].balance : 0);
}

// MARKET
async function loadMarket(){
  const { data } = await client
    .from("market")
    .select("*");

  const el = document.getElementById("market");
  el.innerHTML = "";

  data.forEach(track => {
    el.innerHTML += `
      <div class="card">
        <h2>${track.title}</h2>
        <p>Price: $${track.price.toFixed(2)}</p>
        <button onclick="buy('${track.id}')">BUY</button>
        <button onclick="sell('${track.id}')">SELL</button>
      </div>
    `;
  });
}

// BUY
async function buy(trackId){
  const { error } = await client.rpc('buy_track', {
    u: userId,
    t: trackId
  });

  if(error){
    console.log(error);
    alert("BUY FAILED");
  }

  refresh();
}

// SELL
async function sell(trackId){
  const { error } = await client.rpc('sell_track', {
    u: userId,
    t: trackId
  });

  if(error){
    console.log(error);
    alert("SELL FAILED");
  }

  refresh();
}

// PORTFOLIO
async function loadPortfolio(){
  const { data } = await client
    .from("portfolio")
    .select("*")
    .eq("user_id", userId);

  const el = document.getElementById("portfolio");
  el.innerHTML = "";

  data.forEach(item => {
    el.innerHTML += `
      <div>${item.track_id} — ${item.shares} shares</div>
    `;
  });
}

// DEPOSIT (leave as is)
async function deposit(key){
  alert("Deposit system needs Stripe function fix");
}

// REFRESH
async function refresh(){
  await ensureUser();
  await loadBalance();
  await loadMarket();
  await loadPortfolio();
}

// START
refresh();

</script>

</body>
</html>

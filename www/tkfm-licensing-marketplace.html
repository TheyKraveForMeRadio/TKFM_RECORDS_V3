<!DOCTYPE html>
<html>

<head>
<title>TKFM Licensing Marketplace</title>
<script src="/js/tkfm-master-autoload.js"></script>
<script src="/js/tkfm-theme.js"></script>
<script src="/js/tkfm-animations.js"></script>
</head>

<body>

<h1>Music Licensing Marketplace</h1>

<button onclick="browse()">Browse Catalog</button>

<pre id="results"></pre>

<script>

async function browse(){

 const res = await fetch(
 "/.netlify/functions/api/licensing-marketplace"
 )

 const data = await res.json()

 document.getElementById("results").innerText =
 JSON.stringify(data,null,2)

}

</script>

<script src="/js/tkfm-global-nav.js"></script>
</body>

</html>

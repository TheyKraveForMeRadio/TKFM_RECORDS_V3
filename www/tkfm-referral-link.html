<h1>Share Your Song Investment Link</h1>

<input id="link" value="https://tkfmrecords.com/invest/song123?ref=artist">

<button onclick="copyLink()">Copy Link</button>

const input=document.getElementById("link")

input.select()

document.execCommand("copy")

alert("Link copied!")

}

</script>

<div style="padding:20px;text-align:center">

  <h2 style="color:#facc15">💳 Add Funds</h2>

  <button onclick="deposit('tkfm_deposit_10')" style="margin:10px;padding:12px 20px;background:#facc15;border:none;border-radius:10px;">Deposit $10</button>
  
  <button onclick="deposit('tkfm_deposit_25')" style="margin:10px;padding:12px 20px;background:#facc15;border:none;border-radius:10px;">Deposit $25</button>
  
  <button onclick="deposit('tkfm_deposit_50')" style="margin:10px;padding:12px 20px;background:#facc15;border:none;border-radius:10px;">Deposit $50</button>

</div>

<script>
async function deposit(key){
  const res = await fetch("/.netlify/functions/create-checkout-session", {
    method:"POST",
    headers: {
      "Content-Type":"application/json"
    },
    body: JSON.stringify({
      lookup_key: key,
      user_id: localStorage.getItem("tkfm_user")
    })
  });

  const data = await res.json();

  if(data.url){
    window.location = data.url;
  } else {
    alert("Error creating checkout");
  }
}
</script>

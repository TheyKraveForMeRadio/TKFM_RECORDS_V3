<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TKFM Login</title>

  <style>
    body {
      background: #020617;
      color: #facc15;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    h1 {
      margin-bottom: 30px;
    }

    input {
      width: 90%;
      max-width: 400px;
      padding: 15px;
      margin: 15px 0;
      border-radius: 12px;
      border: 2px solid #facc15;
      background: #111;
      color: white;
      font-size: 16px;
    }

    button {
      display: block;
      width: 220px;
      margin: 15px auto;
      padding: 15px;
      border-radius: 12px;
      border: none;
      background: #facc15;
      color: #000;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <h1>🔐 Login to TKFM</h1>

  <input type="email" placeholder="Enter your email" />

  <button onclick="sendCode()">Send Code</button>

  <input type="text" placeholder="Enter 6-digit code" />

  <button onclick="verifyLogin()">Verify & Login</button>

  <!-- ✅ ONLY THIS SCRIPT (auth.js REMOVED) -->
  <script src="/js/login.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>

<head>
<link rel="stylesheet" href="css/tkfm-global.css?v=3">
<link rel="stylesheet" href="css/tkfm-global.css?v=2">
<link rel="stylesheet" href="css/tkfm-global.css">
<title>Royalty Payout Dashboard</title>
<script src="/js/tkfm-master-autoload.js"></script>
<link rel="stylesheet" href="css/mobile.css">
<link rel="manifest" href="/manifest.json">
</head>


<h1>Royalty Payout Dashboard</h1>

<pre id="payouts"></pre>

<script>

async function load(){

 const res = await fetch(
 '/.netlify/functions/api/royalty-payouts'
 );

 const data = await res.json();

 document.getElementById("payouts")
 .textContent =
 JSON.stringify(data,null,2);

}

load();

</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

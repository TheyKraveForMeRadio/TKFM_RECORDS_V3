<!DOCTYPE html>
<html>


<h1>Top Investors</h1>

<pre id="investors"></pre>

<script>

async function load(){

 const res =
 await fetch(
 '/.netlify/functions/api/investor-leaderboard'
 );

 const data =
 await res.json();

 document.getElementById("investors")
 .textContent =
 JSON.stringify(data,null,2);

}

load()

</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

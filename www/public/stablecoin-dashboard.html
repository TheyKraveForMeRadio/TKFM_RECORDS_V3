<!DOCTYPE html>
<html>


<h1>MUSD Stablecoin Supply</h1>

<pre id="supply"></pre>

<script>

async function load(){

 const res =
 await fetch('/.netlify/functions/api/stablecoin-supply');

 const data =
 await res.json();

 document.getElementById("supply")
 .textContent =
 JSON.stringify(data,null,2);

}

load();

</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

<!DOCTYPE html>
<html>


<h1>Music Sovereign Wealth Funds</h1>

<pre id="funds"></pre>

<script>

async function load(){

 const res =
 await fetch(
 '/.netlify/functions/api/sovereign-fund-engine'
 );

 const data = await res.json();

 document.getElementById("funds")
 .textContent =
 JSON.stringify(data,null,2);

}

load();

</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

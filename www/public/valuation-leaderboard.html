<!DOCTYPE html>
<html>


<h1>Catalog Valuation Leaderboard</h1>

<pre id="leaderboard"></pre>

<script>

async function load(){

 const res =
 await fetch(
 '/.netlify/functions/api/valuation-leaderboard'
 );

 const data =
 await res.json();

 document.getElementById("leaderboard")
 .textContent =
 JSON.stringify(data,null,2);

}

load()

</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

<!DOCTYPE html>
<html>


<h1>Artists</h1>

<pre id="artists"></pre>

<script>

async function load(){

 const res =
 await fetch('/.netlify/functions/api/artists-list');

 const data =
 await res.json();

 document.getElementById("artists")
 .textContent =
 JSON.stringify(data,null,2);

}

load()

</script>

<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/sw.js")}</script>
</body>
</html>

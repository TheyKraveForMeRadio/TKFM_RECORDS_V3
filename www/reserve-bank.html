<!DOCTYPE html>
<html>

<head>
<title>TKFM Reserve Bank</title>
<script src="/js/tkfm-master-autoload.js"></script>
<script src="/js/tkfm-theme.js"></script>
<script src="/js/tkfm-animations.js"></script>
</head>

<body>

<h1>TKFM Global Music Reserve</h1>

<pre id="data"></pre>

<script>

async function load(){

 const res = await fetch(
  "/.netlify/functions/api/reserve-dashboard"
 );

 const data = await res.json();

 document.getElementById("data").innerText =
  JSON.stringify(data,null,2);

}

load();

setInterval(load,60000);

</script>

<script src="/js/tkfm-global-nav.js"></script>
</body>
</html>

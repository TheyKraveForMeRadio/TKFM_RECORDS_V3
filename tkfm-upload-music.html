<!DOCTYPE html>
<html>

<head>
<title>Upload Music to TKFM</title>
<script src="/js/tkfm-master-autoload.js"></script>
</head>

<body>

<h1>Upload Track</h1>

<input id="artist" placeholder="Artist">
<input id="title" placeholder="Track Title">

<button onclick="upload()">Upload</button>

<pre id="result"></pre>

<script>

async function upload(){

 const artist = document.getElementById("artist").value;
 const title = document.getElementById("title").value;

 const token = localStorage.getItem("token");
 const wallet = localStorage.getItem("walletAddress");

 // 🔹 STEP 1: SAVE TRACK
 const res = await fetch("/.netlify/functions/api/upload-track", {
  method:"POST",
  headers:{ "Content-Type":"application/json" },
  body:JSON.stringify({
   artist,
   title,
   file_url:"pending"
  })
 });

 const data = await res.json();

 // 🔹 STEP 2: BUILD METADATA
 const metadataURI = JSON.stringify({
   name:title,
   artist:artist,
   file:data.file_url || "pending"
 });

 // 🔹 STEP 3: MINT VIA ENGINE
 const mintRes = await fetch("/.netlify/functions/engine/mint-song-nft", {
  method:"POST",
  headers:{
    "Content-Type":"application/json",
    "Authorization":"Bearer " + token
  },
  body:JSON.stringify({
    metadataURI,
    catalog_id: data.id || Date.now(),
    wallet
  })
 });

 const mintData = await mintRes.json();

 document.getElementById("result").innerText =
 JSON.stringify({
   upload:data,
   mint:mintData
 }, null, 2);

}

</script>

</body>

</html>

<!DOCTYPE html>
<html>

<head>
<title>Upload Music to TKFM</title>
<script type="module">
import { mintSongNFT } from "/js/tkfm-contract.js";
</script>
</head>

<body>

<h1>Upload Track</h1>

<input id="artist" placeholder="Artist">
<input id="title" placeholder="Track Title">

<button onclick="upload()">Upload</button>

<pre id="result"></pre>

<script type="module">

import { mintSongNFT } from "/js/tkfm-contract.js";

async function upload(){

  const artist = document.getElementById("artist").value;
  const title = document.getElementById("title").value;

  const res = await fetch("/.netlify/functions/api/upload-track", {
    method:"POST",
    body:JSON.stringify({
      artist,
      title,
      file_url:"pending"
    })
  });

  const data = await res.json();

  document.getElementById("result").innerText =
  JSON.stringify(data,null,2);

  const metadataURI = "https://tkfm-metadata/"+Date.now();

  // 🚀 1. MINT NFT
  const receipt = await mintSongNFT(metadataURI);

  const catalog_id = Date.now();

  // 🚀 2. FRACTIONALIZE NFT
  await fetch("/.netlify/functions/engine/fractionalize-nft-engine", {
    method:"POST",
    body:JSON.stringify({
      catalog_id,
      total_shares: 1000
    })
  });

  console.log("NFT → Shares created");

}

window.upload = upload;

</script>

</body>

</html>
